[project]
name = "phileas-memory"
version = "0.7.1"
description = "Local-first long-term memory for AI companions"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "memory", "llm", "ai", "embeddings", "local-first", "rag"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp[cli]",
    "sentence-transformers>=5.3.0",
    "chromadb>=1.0.0",
    "kuzu>=0.8.0",
    "click>=8.3.1",
    "rich>=14.3.3",
    "fastapi>=0.136.3",
    "uvicorn>=0.42.0",
    "tomli-w>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/alexajuno/phileas"
Repository = "https://github.com/alexajuno/phileas"
Issues = "https://github.com/alexajuno/phileas/issues"

[project.scripts]
phileas = "phileas.cli:app"

[project.optional-dependencies]
embeddings = ["sentence-transformers"]
# Internal extraction LLM (the observer capture path). Off unless [llm] is
# enabled with a key present, so the SDK stays an opt-in install.
extraction = ["anthropic"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.5.1",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phileas"]

[tool.hatch.build.targets.sdist]
# Scope the source distribution to the package and its metadata. Without this,
# hatchling sweeps in everything not VCS-ignored, including research data,
# bloating the tarball past PyPI's size limit. only-include is a strict
# allowlist (README and pyproject are added automatically as metadata).
only-include = [
    "src/phileas",
    "tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
# A scoped gate, not a full-package check. The 20k-line engine predates any typing
# discipline and reports hundreds of errors under mypy; cleaning it is out of scope.
# What we enforce here is the backend contract MemoryEngine is typed against: the
# SDK seam (the files below) must type-check, and typecheck/conformance.py proves
# each concrete store is assignable to its Protocol at the signature level (the
# runtime name-level counterpart lives in tests/test_backends.py). Widen `files`
# one module at a time as the codebase gains annotations.
python_version = "3.11"
# Resolve `phileas.*` from the source tree, so followed imports carry real types
# (without this the concrete stores degrade to Any and conformance checks pass
# vacuously). Reads source directly — no install needed in CI.
mypy_path = "src"
# Follow imports for type info but suppress errors in modules outside `files`,
# so the engine's existing type debt doesn't fail this gate.
follow_imports = "silent"
# Third-party deps (chromadb, kuzu, sentence_transformers, ...) ship no stubs.
ignore_missing_imports = true
files = [
    "typecheck",
    "src/phileas/backends.py",
    "src/phileas/factory.py",
    "src/phileas/client.py",
]
