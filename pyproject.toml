[project]
name = "phileas-memory"
version = "0.4.0"
description = "Local-first long-term memory for AI companions"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "memory", "llm", "ai", "embeddings", "local-first", "rag"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp[cli]",
    "sentence-transformers>=5.3.0",
    "chromadb>=1.0.0",
    "kuzu>=0.8.0",
    "click>=8.3.1",
    "rich>=14.3.3",
    "fastapi>=0.136.3",
    "uvicorn>=0.42.0",
]

[project.urls]
Homepage = "https://github.com/alexajuno/phileas"
Repository = "https://github.com/alexajuno/phileas"
Issues = "https://github.com/alexajuno/phileas/issues"

[project.scripts]
phileas = "phileas.cli:app"

[project.optional-dependencies]
embeddings = ["sentence-transformers"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phileas"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
